<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citadele – Naudas piedzīvojums!</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,400&family=Bangers&display=swap" rel="stylesheet">
<style>
:root {
  --red:#E3002C; --black:#251F30; --white:#FFFFFF;
  --pink:#FFBCBC; --neutral:#675F6B; --accent:#804F91;
  --yellow:#FFD700; --green:#2e7d32; --blue:#1565C0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);font-family:'Roboto',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#book-wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;perspective:1400px;}
.page-holder{position:relative;width:min(920px,96vw);height:min(630px,90vh);}
.page{position:absolute;inset:0;background:#fff;border-radius:4px 14px 14px 4px;overflow:hidden;box-shadow:-6px 0 24px rgba(0,0,0,.5),8px 4px 48px rgba(0,0,0,.35);display:none;flex-direction:column;transform-origin:left center;}
.page.active{display:flex;animation:flipIn .5s cubic-bezier(.4,0,.2,1) both;}
.page.leaving{display:flex;animation:flipOut .4s cubic-bezier(.4,0,.2,1) both;pointer-events:none;}
@keyframes flipIn{from{transform:rotateY(-80deg);opacity:0;}to{transform:rotateY(0);opacity:1;}}
@keyframes flipOut{from{transform:rotateY(0);opacity:1;}to{transform:rotateY(80deg);opacity:0;}}
.strip{height:36px;background:var(--red);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;}
.strip-title{color:#fff;font-weight:900;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;flex:1;}
.strip-badge{background:#fff;color:var(--red);border-radius:50%;width:26px;height:26px;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;}
.strip-c{background:#fff;color:var(--red);border-radius:6px;width:22px;height:22px;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;}
.strip-brand{color:#fff;font-weight:900;font-size:13px;letter-spacing:1px;}
.panels{flex:1;display:grid;gap:5px;padding:5px;overflow:hidden;}
.panel{border:2.5px solid var(--black);border-radius:6px;overflow:hidden;position:relative;background:#f8f8f8;}
.bg-sky{background:linear-gradient(160deg,#d4eeff,#edf8ff);}
.bg-warm{background:linear-gradient(160deg,#fffbe8,#fff3cd);}
.bg-soft{background:linear-gradient(160deg,#f9f9f9,#efefef);}
.bg-pink{background:linear-gradient(160deg,#fff0f0,#ffe0e0);}
.bg-purple{background:linear-gradient(160deg,#f3edff,#e9dffa);}
.bg-green{background:linear-gradient(160deg,#eafaf0,#d4f0df);}
.bub{position:absolute;background:#fff;border:2px solid var(--black);border-radius:14px;padding:7px 11px;font-size:11px;font-weight:700;line-height:1.35;max-width:185px;z-index:20;text-align:center;}
.bub.tail-b::after,.bub.tail-b::before{content:'';position:absolute;border:9px solid transparent;left:50%;transform:translateX(-50%);}
.bub.tail-b::before{border-top:13px solid var(--black);bottom:-24px;}
.bub.tail-b::after{border-top:12px solid #fff;bottom:-20px;z-index:1;}
.bub.tail-r::before{content:'';border:8px solid transparent;border-left:13px solid var(--black);position:absolute;right:-27px;top:50%;transform:translateY(-50%);}
.bub.tail-r::after{content:'';border:8px solid transparent;border-left:12px solid #fff;position:absolute;right:-24px;top:50%;transform:translateY(-50%);z-index:1;}
.bub.tail-l::before{content:'';border:8px solid transparent;border-right:13px solid var(--black);position:absolute;left:-27px;top:50%;transform:translateY(-50%);}
.bub.tail-l::after{content:'';border:8px solid transparent;border-right:12px solid #fff;position:absolute;left:-24px;top:50%;transform:translateY(-50%);z-index:1;}
.cap{position:absolute;padding:4px 9px;border:2px solid var(--black);font-size:10px;font-weight:700;border-radius:3px;z-index:15;line-height:1.2;}
.cap-y{background:var(--yellow);color:var(--black);}
.cap-r{background:var(--red);color:#fff;}
.cap-b{background:#1565C0;color:#fff;}
.cap-p{background:var(--accent);color:#fff;}
.cap-g{background:#2e7d32;color:#fff;}
.cap-k{background:var(--black);color:#fff;}
.sfx{position:absolute;font-family:'Bangers',cursive;text-shadow:2px 2px 0 rgba(0,0,0,.2);z-index:25;letter-spacing:2px;}
#nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:200;background:rgba(37,31,48,.93);padding:10px 20px;border-radius:50px;backdrop-filter:blur(8px);}
.nbtn{background:var(--red);color:#fff;border:none;border-radius:50px;padding:9px 22px;font-family:'Roboto',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .18s;letter-spacing:.4px;}
.nbtn:hover{background:#b5001f;transform:scale(1.06);}
.nbtn:disabled{background:#555;cursor:not-allowed;transform:none;}
#pginfo{color:rgba(255,255,255,.8);font-weight:700;font-size:13px;min-width:55px;text-align:center;}
.dots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:all .2s;}
.dot.on{background:var(--red);transform:scale(1.5);}
.qbtn{display:block;width:100%;background:#fff;border:2px solid var(--black);border-radius:7px;padding:6px 10px;font-family:'Roboto',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-align:left;transition:all .18s;margin-bottom:5px;color:var(--black);}
.qbtn:hover:not(:disabled){background:var(--pink);transform:translateX(3px);}
.qbtn.ok{background:#c8e6c9;border-color:#2e7d32;}
.qbtn.no{background:#ffcdd2;border-color:#c62828;}
.infobox{position:absolute;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:8px 11px;font-size:10px;font-weight:700;line-height:1.5;z-index:20;color:var(--black);}
.infobox .ibt{color:var(--accent);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.cover-wrap{height:100%;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
.cover-wrap::before{content:'';position:absolute;top:-60px;right:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07);}
.cover-wrap::after{content:'';position:absolute;bottom:-80px;left:-50px;width:340px;height:340px;border-radius:50%;background:rgba(0,0,0,.1);}
</style>
</head>
<body>
<div id="book-wrap"><div class="page-holder" id="holder"></div></div>
<div id="nav">
  <button class="nbtn" id="bp">&#8592; Atpakaļ</button>
  <div class="dots" id="dots"></div>
  <span id="pginfo">1/10</span>
  <button class="nbtn" id="bn">Tālāk &#8594;</button>
</div>
<script>
/* ══════════════════════════════════════
   PERSONĀŽI
══════════════════════════════════════ */

const QUIZ_STATE={};
function answerQ(pid,qi,chosen){
  if(QUIZ_STATE[pid+'_'+qi]!==undefined) return;
  QUIZ_STATE[pid+'_'+qi]=chosen;
  const qs=window['qdata_'+pid];
  if(!qs) return;
  const q=qs[qi];
  for(let i=0;i<q.opts.length;i++){
    const b=document.getElementById(`q${pid}_${qi}_${i}`);
    if(!b) continue;
    b.disabled=true;
    if(i===q.ans) b.classList.add('ok');
    else if(i===chosen&&chosen!==q.ans) b.classList.add('no');
  }
  const fb=document.getElementById(`qfb${pid}_${qi}`);
  if(fb){fb.textContent=(chosen===q.ans?'✅ ':'❌ ')+q.explain;fb.style.color=chosen===q.ans?'#2e7d32':'#c62828';}
  const all=qs.every((_,i)=>QUIZ_STATE[pid+'_'+i]!==undefined);
  if(all){
    const score=qs.filter((_,i)=>QUIZ_STATE[pid+'_'+i]===qs[i].ans).length;
    setTimeout(()=>{
      const el=document.getElementById('qscore_'+pid);
      if(el){el.textContent=`🎉 ${score}/${qs.length} pareizi! ${score===qs.length?'PERFEKTI! Tu esi naudas eksperts! 🏆':score>=3?'Lieliski! Gandrīz perfekti! ⭐':score>=2?'Labi darīts, turpini mācīties! 📚':'Vēl var iemācīties! Tu vari! 💪'}`;el.style.display='block';}
    },300);
  }
}
function qpanel(pid,qi,q){
  return `<div style="background:#fff;border:2px solid var(--black);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:3px;">
    <div style="font-size:10px;font-weight:700;color:var(--red);letter-spacing:1px;">J${qi+1}</div>
    <div style="font-size:11px;font-weight:700;color:var(--black);line-height:1.35;margin-bottom:4px;">${q.q}</div>
    ${q.opts.map((o,i)=>`<button id="q${pid}_${qi}_${i}" class="qbtn" onclick="answerQ('${pid}',${qi},${i})">${o}</button>`).join('')}
    <div id="qfb${pid}_${qi}" style="font-size:9px;font-weight:700;min-height:11px;margin-top:2px;line-height:1.3;"></div>
  </div>`;
}

/* ══════════════════════════════════════
   GRĀMATAS DZINĒJS
══════════════════════════════════════ */
let cur=0;
const holder=document.getElementById('holder');
const bp=document.getElementById('bp');
const bn=document.getElementById('bn');
const pginfo=document.getElementById('pginfo');
const dotsEl=document.getElementById('dots');
const els=PAGES.map((p)=>{
  const d=document.createElement('div');
  d.className='page';
  d.innerHTML=p.html();
  holder.appendChild(d);
  return d;
});
function buildDots(){
  dotsEl.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===cur?' on':'');
    d.onclick=()=>goTo(i);
    dotsEl.appendChild(d);
  });
}
function updateUI(){
  pginfo.textContent=`${cur+1}/${PAGES.length}`;
  bp.disabled=cur===0;
  bn.disabled=cur===PAGES.length-1;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
}
function goTo(idx){
  if(idx<0||idx>=PAGES.length||idx===cur) return;
  const leaving=els[cur];
  leaving.classList.add('leaving');
  leaving.addEventListener('animationend',()=>{leaving.classList.remove('active','leaving');leaving.style.display='none';},{once:true});
  cur=idx;
  const next=els[cur];
  next.style.display='flex';
  next.style.flexDirection='column';
  requestAnimationFrame(()=>next.classList.add('active'));
  updateUI();
}
els[0].classList.add('active');
buildDots();
updateUI();
bn.onclick=()=>goTo(cur+1);
bp.onclick=()=>goTo(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goTo(cur+1);if(e.key==='ArrowLeft')goTo(cur-1);});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].clientX;if(Math.abs(d)>50)d>0?goTo(cur+1):goTo(cur-1);},{passive:true});
</script>
